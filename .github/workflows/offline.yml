name: offline-safety

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # CI는 홈 conda·실물 calibration을 사용하지 않는다. MuJoCo 미러 계약에
      # 필요한 최소 런타임만 깨끗한 setup-python 환경에 설치한다.
      - run: python -m pip install numpy opencv-python-headless pillow mujoco
      - run: python offline_test.py --ci
